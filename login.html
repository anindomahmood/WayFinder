<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
        type="image/png"
        href="/WayFinder/ImgLab/Favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courgette&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Oswald:wght@200..700&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
 </head>
<body>
 <div id="login-container">
  
  <div id="form-container">
    <div id="logo-container">
      <img src="/WayFinder/ImgLab/WayFinder.png" alt="Logo">
    </div>

    <h1 id="login-heading">Login</h1>

    <form id="login-form">
      <div class="input-row">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email">
      </div>

      <div class="input-row">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password">
      </div>

      <div id="button-row">
        <button type="submit" id="login-btn"><a href="index.html">Login</a></button>
        <button type="button" id="signin-btn"><a href="sign_in.html">Sign in</a></button>
      </div>
    </form>

    <p id="signup-text">Don't have an account? <a href="#" id="signup-link">Sign in</a></p>
  </div>
   <div id="picture-container">
     <img src="/WayFinder/ImgLab/LogIn.jpg" alt="Logo">
   </div>
 </div>
 
  
</body>
</html>
